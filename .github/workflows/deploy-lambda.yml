name: Deploy Lambda

on:
  workflow_dispatch:
    inputs:
      stack_name:
        description: CloudFormation stack name
        required: true
        default: feature-releases-slack-port-demo
      environment_name:
        description: Short environment name used in the Lambda function name
        required: true
        default: demo
      slack_channel_id:
        description: Slack channel ID to listen to
        required: true
        default: C0B8VL89V0B
      slack_channel_name:
        description: Human-readable Slack channel name
        required: true
        default: test-channel
      target_branch:
        description: Target repository branch for generated Cursor prompts
        required: true
        default: main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up SAM
        uses: aws-actions/setup-sam@v2

      - name: Build Lambda artifact
        run: sam build --use-container

      - name: Deploy stack
        run: |
          sam deploy \
            --stack-name "${{ inputs.stack_name }}" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              EnvironmentName="${{ inputs.environment_name }}" \
              SlackSigningSecret="${{ secrets.SLACK_SIGNING_SECRET }}" \
              SlackChannelId="${{ inputs.slack_channel_id }}" \
              SlackChannelName="${{ inputs.slack_channel_name }}" \
              SlackWorkspaceDomain="${{ vars.SLACK_WORKSPACE_DOMAIN }}" \
              PortClientId="${{ secrets.PORT_CLIENT_ID }}" \
              PortClientSecret="${{ secrets.PORT_CLIENT_SECRET }}" \
              TargetBranch="${{ inputs.target_branch }}"

      - name: Print stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "${{ inputs.stack_name }}" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table
